# お店のページの中身です。このファイルだけを書き換えてください。
# 書き換えて保存（Commit changes）すると、1〜2分でページが新しくなります。
# 「: 」の右側が表示される文字です。左側（shop_name など）は変えないでください。

# 店名
shop_name: "炭火やきとり 見本亭"

# 大きな見出し（キャッチ）。改行したいところは \n と書きます。
catch: "炭火で、\n一本ずつ。"

# 営業時間。1行目がページ上部にも大きく出ます。行は増やせます。
hours:
  - label: "営業時間"
    time: "17:00〜23:00"
  - label: "ラストオーダー"
    time: "料理22:30・飲み物22:45"

# 定休日
holidays: "月曜（祝日の場合は翌日）"

# お知らせ。新しいものを上に書きます。日付は 2026-10-25 の形で。
notices:
  - date: "2026-10-25"
    text: "（動作の確認）このお知らせは、書き換えの試しで足しました。"
  - date: "2026-10-25"
    text: "11月から、新米の鶏そぼろご飯をはじめます。"
  - date: "2026-10-18"
    text: "10月28日（火）は、店内改装のためお休みします。"

# お品書き。値段は数字だけ（円は自動でつきます）。
menu:
  - name: "ねぎま"
    price: "220"
  - name: "もも（塩・たれ）"
    price: "200"
  - name: "皮（たれ）"
    price: "180"
  - name: "豚バラ"
    price: "220"
  - name: "月見つくね"
    price: "330"
  - name: "若鶏の唐揚げ 五個"
    price: "680"
  - name: "だし巻き玉子"
    price: "520"
  - name: "鶏そぼろご飯"
    price: "450"
  - name: "生ビール（中）"
    price: "580"
  - name: "レモンサワー"
    price: "480"

# 写真。editable/assets/img に入れた写真の名前を img/○○.jpg の形で書きます。
photos:
  hero: "img/hero_yakitori.jpg"
  hero_alt: "炭火で焼いた焼き鳥の盛り合わせ"
  story: "img/grill.jpg"
  story_alt: "焼き台で串を焼いている手元"
